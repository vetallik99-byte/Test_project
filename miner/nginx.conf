server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Root points to React build output copied in image
  root /usr/share/nginx/html;
  index index.html;

  # Gzip for common static types
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
  gzip_min_length 1024;

  # Cache immutable build asset files (contain content hashes)
  location ~* \.(?:js|css|ico|png|jpg|jpeg|gif|svg)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Websocket proxy to backend service (Go server on :8080)
  location /ws {
    proxy_pass http://backend:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }

  # SPA fallback: any other request serve index.html
  location / {
    try_files $uri /index.html;
  }
}
